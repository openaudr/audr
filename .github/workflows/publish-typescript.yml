name: Publish TypeScript package

# A tag <package-directory>/v<version>, such as adapters/core/typescript/v0.1.0, on a commit
# of main publishes that package to npm, with provenance, once a maintainer approves the
# deployment environment. The tag and the package's CHANGELOG.md section are the release
# record; no GitHub Release is created.

on:
  push:
    tags:
      - "*/*/typescript/v*"

permissions:
  contents: read

concurrency:
  group: publish-typescript-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      distribution: ${{ steps.resolve.outputs.distribution }}
      environment: ${{ steps.resolve.outputs.environment }}
      version: ${{ steps.resolve.outputs.version }}
      directory: ${{ steps.resolve.outputs.directory }}
      dist_tag: ${{ steps.resolve.outputs.dist_tag }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Map tag to package
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          directory="${TAG%/v*}"
          version="${TAG##*/v}"
          if [[ ! -f "$directory/package.json" ]]; then
            echo "::error::tag $TAG does not name a TypeScript package directory"; exit 1
          fi
          distribution="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["name"])' "$directory/package.json")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "::error::tag $TAG does not name a release version"; exit 1
          fi
          # npm points `latest` at every version it is given, so a prerelease goes to `next`.
          dist_tag=latest
          [[ "$version" == *-* ]] && dist_tag=next
          {
            echo "distribution=$distribution"
            echo "environment=npm-${distribution#@*/}"
            echo "version=$version"
            echo "directory=$directory"
            echo "dist_tag=$dist_tag"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Verify and pack
    runs-on: ubuntu-latest
    needs: resolve
    defaults:
      run:
        working-directory: ${{ needs.resolve.outputs.directory }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # No dependency cache: a release is built from a clean install.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Check version and changelog
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: python3 "$GITHUB_WORKSPACE/tools/check_release.py" . "$VERSION"

      - name: Install
        run: make install

      - name: Verify
        run: make verify

      # CI tests a dependent against the workspace core, which may be ahead of the lowest
      # published core its peer range admits.
      - name: Verify against the core at its peer floor
        if: needs.resolve.outputs.directory != 'adapters/core/typescript'
        run: node "$GITHUB_WORKSPACE/tools/verify-npm-package.mjs" . --core-floor

      - name: Pack
        run: npm pack

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tarball
          path: ${{ needs.resolve.outputs.directory }}/*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [resolve, build]
    environment:
      name: ${{ needs.resolve.outputs.environment }}
      url: https://www.npmjs.com/package/${{ needs.resolve.outputs.distribution }}/v/${{ needs.resolve.outputs.version }}
    permissions:
      id-token: write
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing requires npm 11.5.1 or later.
      - name: Install npm
        run: npm install --global npm@11.19.1

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tarball

      # npm authenticates through Trusted Publishing when the package has a trusted
      # publisher, and otherwise with the environment's NPM_TOKEN.
      - name: Publish
        env:
          DIST_TAG: ${{ needs.resolve.outputs.dist_tag }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./*.tgz --tag "$DIST_TAG"
