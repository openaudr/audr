name: Publish Python package

# A tag <package-directory>/v<version>, such as adapters/core/python/v0.2.0, on a commit of
# main publishes that package to PyPI through Trusted Publishing. The tag and the package's
# CHANGELOG.md section are the release record; no GitHub Release is created.

on:
  push:
    tags:
      - "*/*/python/v*"

permissions:
  contents: read

concurrency:
  group: publish-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      distribution: ${{ steps.resolve.outputs.distribution }}
      version: ${{ steps.resolve.outputs.version }}
      directory: ${{ steps.resolve.outputs.directory }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Map tag to package
        id: resolve
        env:
          TAG: ${{ github.ref_name }}
        run: |
          directory="${TAG%/v*}"
          version="${TAG##*/v}"
          if [[ ! -f "$directory/pyproject.toml" ]]; then
            echo "::error::tag $TAG does not name a Python package directory"; exit 1
          fi
          distribution="$(python3 -c 'import sys, tomllib; print(tomllib.load(open(sys.argv[1], "rb"))["project"]["name"])' "$directory/pyproject.toml")"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "::error::tag $TAG does not name a release version"; exit 1
          fi
          {
            echo "distribution=$distribution"
            echo "version=$version"
            echo "directory=$directory"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Verify and build
    runs-on: ubuntu-latest
    needs: resolve
    defaults:
      run:
        working-directory: ${{ needs.resolve.outputs.directory }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v6
        with:
          version: "0.12.18"
          python-version: "3.12"
          enable-cache: false

      - name: Check version and changelog
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: uv run --no-project python "$GITHUB_WORKSPACE/tools/check_release.py" . "$VERSION"

      - name: Install
        run: make install

      - name: Verify
        run: make verify

      - name: Build
        run: make build

      - name: Check distributions
        run: uvx twine==7.0.0 check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ needs.resolve.outputs.directory }}/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [resolve, build]
    environment:
      name: pypi-${{ needs.resolve.outputs.distribution }}
      url: https://pypi.org/project/${{ needs.resolve.outputs.distribution }}/${{ needs.resolve.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
