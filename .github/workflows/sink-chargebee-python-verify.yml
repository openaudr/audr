name: Verify Chargebee sink (Python)

on:
  push:
    branches: [main]
    paths:
      - "sinks/chargebee/python/**"
      - "adapters/core/python/**"
      - ".github/workflows/sink-chargebee-python-verify.yml"
  pull_request:
    paths:
      - "sinks/chargebee/python/**"
      - "adapters/core/python/**"
      - ".github/workflows/sink-chargebee-python-verify.yml"

permissions:
  contents: read

concurrency:
  group: sink-chargebee-python-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: sinks/chargebee/python

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v6
        with:
          version: "0.12.18"
          python-version: "${{ matrix.python }}"

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Examples
        run: make examples

  package:
    name: Build and isolation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v6
        with:
          version: "0.12.18"
          python-version: "3.12"

      - name: Install
        run: make install

      - name: Build and verify isolation
        run: make isolation

      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audr-sink-chargebee-dist
          path: sinks/chargebee/python/dist/
