name: Verify core SDK (TypeScript)

on:
  push:
    branches: [main]
    paths:
      - "adapters/core/typescript/**"
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/adapter-core-typescript-verify.yml"
  pull_request:
    paths:
      - "adapters/core/typescript/**"
      - "spec/**"
      - "conformance/**"
      - ".github/workflows/adapter-core-typescript-verify.yml"

permissions:
  contents: read

concurrency:
  group: adapter-core-typescript-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: adapters/core/typescript

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "${{ matrix.node }}"
          cache: npm
          cache-dependency-path: adapters/core/typescript/package-lock.json

      - name: Install
        run: make install

      - name: Lint
        run: make lint

      - name: Tests
        run: make test

      - name: Examples
        run: make examples

  package:
    name: Build and isolation
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout project
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: adapters/core/typescript/package-lock.json

      - name: Install
        run: make install

      - name: Build and verify isolation
        run: make isolation
