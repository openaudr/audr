[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "audr-adapter-nemo-relay"
dynamic = ["version"]
description = "NVIDIA NeMo Relay adapter for AUDR (experimental)"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "The AUDR contributors", email = "audr@chargebee.com" },
]
keywords = ["audr", "nemo", "nvidia", "agent", "adapter", "metering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "audr>=0.1.0a1,<0.2",
  "pydantic>=2.7,<3",
]

[project.optional-dependencies]
# The runtime is optional so the adapter can be installed and type-checked
# without it; activation raises if it is missing or out of range.
runtime = [
  "nemo-relay>=0.8,<0.9",
]
# Dependencies used by the runnable network example.
example = [
  "httpx>=0.27,<1",
  "nemo-relay>=0.8,<0.9",
]

[project.urls]
Homepage = "https://openaudr.dev"
Issues = "https://github.com/openaudr/audr/issues"
Source = "https://github.com/openaudr/audr/tree/main/adapters/nemo-relay/python"
Changelog = "https://github.com/openaudr/audr/blob/main/adapters/nemo-relay/python/CHANGELOG.md"

[tool.uv.sources]
audr = { path = "../../core/python", editable = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.version]
path = "src/audr_adapter_nemo_relay/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/audr_adapter_nemo_relay"]

[tool.hatch.build.targets.sdist]
# The sdist carries what is needed to build and to read the package, not the
# development tree: tests reach outside the package root and cannot run from it.
only-include = ["src", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
python_version = "3.11"
# `tests` has no `__init__.py`, so the base directories are named rather than guessed;
# without this `tests/helpers.py` resolves as both `helpers` and `tests.helpers`.
explicit_package_bases = true
mypy_path = "src:."

[[tool.mypy.overrides]]
module = ["nemo_relay", "nemo_relay.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `tests` is an implicit namespace package so test modules can share fixtures.
pythonpath = ["."]
markers = [
  "nemo_relay: requires the installed nemo-relay runtime extra",
]
addopts = "-m 'not nemo_relay'"

[tool.coverage.run]
source = ["audr_adapter_nemo_relay"]

[tool.coverage.report]
fail_under = 90
show_missing = true
