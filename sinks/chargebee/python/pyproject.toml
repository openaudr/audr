[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "audr-sink-chargebee"
dynamic = ["version"]
description = "Chargebee sink for AUDR: deliver usage records to Chargebee Usage-Based Billing"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "The AUDR contributors", email = "audr@chargebee.com" },
]
keywords = ["audr", "chargebee", "usage", "billing", "metering", "sink"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13", "Programming Language :: Python :: 3.14",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "audr>=0.1.0a1,<0.2",
  "httpx>=0.27,<1",
]

[project.urls]
Homepage = "https://openaudr.dev"
Issues = "https://github.com/openaudr/audr/issues"
Source = "https://github.com/openaudr/audr/tree/main/sinks/chargebee/python"
Changelog = "https://github.com/openaudr/audr/blob/main/sinks/chargebee/python/CHANGELOG.md"
Specification = "https://openaudr.dev/spec/v1.0.0/"

[tool.hatch.version]
path = "src/audr_sink_chargebee/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/audr_sink_chargebee"]

[tool.hatch.build.targets.sdist]
# The sdist carries what is needed to build and to read the package, not the
# development tree: tests reach outside the package root and cannot run from it.
only-include = ["src", "README.md", "CHANGELOG.md", "LICENSE", "NOTICE"]

[tool.uv.sources]
audr = { path = "../../../adapters/core/python", editable = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
strict = true
files = ["src", "scripts", "tests"]
python_version = "3.11"
# `tests` has no `__init__.py`, so the base directories are named rather than guessed.
explicit_package_bases = true
mypy_path = "src:."

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = [
  "live: talks to a real Chargebee site; needs CHARGEBEE_INGEST_URL, CHARGEBEE_API_KEY, and CHARGEBEE_TEST_SUBSCRIPTION_ID. Run with `-m live`.",
]
# `tests` is an implicit namespace package so test modules can share fixtures.
pythonpath = ["."]

[tool.coverage.run]
source = ["audr_sink_chargebee"]

[tool.coverage.report]
fail_under = 90
show_missing = true
